# The plugin's own build, and the tool versions it applies, written into the plugin's jar as versions.properties.

[versions]
java = "25"
junit = "6.1.3"
assertj = "3.27.7"
lombok = "1.18.48"
slf4j = "2.0.20"
log4j = "2.26.1"

# Quality tools the plugin applies
jacoco = "0.8.16"
checkstyle = "14.4.0"
pmd = "7.29.0"
spotbugs = "4.10.5"
findsecbugs = "1.14.0"
pitest = "1.30.2"
pitest-junit5 = "1.2.3"
min-line-coverage = "0.80"
cpd-minimum-tokens = "50"
max-classes-per-package = "20"

# Gradle plugins the plugin applies (the versions report's is on the Gradle Plugin Portal only)
gradle-forbiddenapis-plugin = "3.11"
gradle-versions-plugin = "0.67.0"
nmcp = "1.6.2"

# This repo's own Kotlin: detekt checks it (only here, never in a build applying the plugin), on the Kotlin it was built with
detekt = "1.23.8"
detekt-kotlin = "2.0.21"

# The oldest Gradle the plugin supports, tested by PublishedPluginTest: the first to run on, and fully support, Java 25
oldest-gradle = "9.1.0"

[libraries]
gradle-forbiddenapis-plugin = { module = "de.thetaphi:forbiddenapis", version.ref = "gradle-forbiddenapis-plugin" }
gradle-versions-plugin = { module = "io.github.ben-manes:gradle-versions-plugin", version.ref = "gradle-versions-plugin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
