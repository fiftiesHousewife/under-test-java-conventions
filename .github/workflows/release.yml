# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Publishes a release when a version tag (v1.2.3) is pushed, and only if every check passes first, including the
# sample builds of the plugin as published, on this build's Gradle and the oldest it supports.
#
# Publishes the plugin and its marker to Maven Central, and makes a GitHub release. Needs these repository secrets:
#   CENTRAL_PORTAL_USERNAME, CENTRAL_PORTAL_PASSWORD  a Central Portal user token
#   SIGNING_KEY, SIGNING_KEY_PASSWORD                 an ASCII-armoured PGP private key, and its passphrase
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/build.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Check the tag is a version and every secret is set
        run: |
          case "${VERSION#v}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "The tag $VERSION isn't a version such as v1.2.3"; exit 1 ;;
          esac
          for name in ORG_GRADLE_PROJECT_centralPortalUsername ORG_GRADLE_PROJECT_centralPortalPassword \
                      ORG_GRADLE_PROJECT_signingInMemoryKey; do
            if [ -z "${!name}" ]; then echo "The secret behind $name isn't set"; exit 1; fi
          done
      - name: Publish to Maven Central
        run: ./gradlew -Pversion="${VERSION#v}" nmcpPublishAggregationToCentralPortal
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${VERSION#v}"
          {
            # What's new for users, written for this release in the repo; then what every release says.
            if [ -f "docs/releases/$v.md" ]; then cat "docs/releases/$v.md"; echo; echo "## Published"; echo; fi
            echo "Published to Maven Central as io.github.fiftieshousewife:java-conventions, applied as the plugin"
            echo "io.github.fiftieshousewife.java-conventions version \"$v\"."
          } > release-notes.md
          gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --verify-tag \
            "build/libs/java-conventions-$v.jar"
